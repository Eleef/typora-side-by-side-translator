name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package plugin
        run: npm run ci

      - name: Validate release tag and package
        run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Reject an existing release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Publish fixes with a new version." >&2
            exit 1
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            channel="Windows prerelease"
          else
            channel="Windows stable release"
          fi
          notes="${channel}. Requires Typora with typora-community-plugin. Translation requests are sent only after explicit consent and a translate command. API keys are session-only by default; users may explicitly opt into plaintext plugin-settings storage. See README and SECURITY.md for installation, privacy boundaries, local-data cleanup, and known limits."
          args=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes --notes "${notes}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/plugin.zip release/SHA256SUMS.txt scripts/install-plugin.ps1 scripts/doctor.ps1 "${args[@]}"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:published -- --version "${{ github.ref_name }}"
