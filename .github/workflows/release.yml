name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package plugin
        run: npm run ci

      - name: Validate release tag and package
        run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Windows Alpha. Requires Typora with typora-community-plugin. Translation requests are only sent after an explicit translate command; API keys remain in the current Typora session. See README and SECURITY.md for installation, privacy boundaries, and known limits."
          args=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes --notes "${notes}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/plugin.zip release/SHA256SUMS.txt scripts/install-plugin.ps1 scripts/doctor.ps1 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/plugin.zip release/SHA256SUMS.txt scripts/install-plugin.ps1 scripts/doctor.ps1 "${args[@]}"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:published -- --version "${{ github.ref_name }}"
