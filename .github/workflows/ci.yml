name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package plugin
        run: npm run ci

      - name: Upload plugin package
        uses: actions/upload-artifact@v7
        with:
          name: typora-side-by-side-translator
          path: release/plugin.zip
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installable plugin
        run: npm run package

      - name: Verify Windows installer and doctor
        run: npm run test:windows-installer
